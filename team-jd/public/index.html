<!DOCTYPE html>
<html lang="ko">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Team — 직무기술서</title>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+KR:wght@300;400;500;700&display=swap" rel="stylesheet">
  <style>
    *,
    *::before,
    *::after {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    :root {
      --bg: #f5f5f7;
      --surface: #ffffff;
      --border: rgba(0, 0, 0, 0.08);
      --text-primary: #1d1d1f;
      --text-secondary: #6e6e73;
      --text-tertiary: #aeaeb2;
      --accent: #0071e3;
      --offline: #34c759;
      --online: #007aff;
      --support: #ff6b00;
      --cross: #5e5ce6;
      --radius: 18px;
      --radius-sm: 12px;
      --shadow-sm: 0 2px 10px rgba(0, 0, 0, 0.07);
      --shadow-lg: 0 20px 60px rgba(0, 0, 0, 0.11);
      --ease: cubic-bezier(0.4, 0, 0.2, 1);
      --nav-h: 52px;
    }

    html {
      scroll-behavior: smooth;
    }

    body {
      font-family: 'Noto Sans KR', -apple-system, BlinkMacSystemFont, sans-serif;
      background: var(--bg);
      color: var(--text-primary);
      -webkit-font-smoothing: antialiased;
    }

    /* NAV */
    .navbar {
      position: fixed;
      top: 0;
      left: 0;
      right: 0;
      height: var(--nav-h);
      background: rgba(245, 245, 247, 0.82);
      -webkit-backdrop-filter: blur(20px) saturate(180%);
      backdrop-filter: blur(20px) saturate(180%);
      border-bottom: 1px solid var(--border);
      z-index: 1000;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .nav-inner {
      width: 100%;
      max-width: 1160px;
      padding: 0 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
    }

    .nav-logo {
      font-size: 17px;
      font-weight: 700;
      letter-spacing: -0.02em;
      cursor: pointer;
    }

    .nav-tabs {
      display: flex;
      gap: 2px;
      background: rgba(0, 0, 0, 0.055);
      border-radius: 10px;
      padding: 3px;
    }

    .nav-tab {
      padding: 5px 14px;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 500;
      color: var(--text-secondary);
      cursor: pointer;
      transition: all 0.2s var(--ease);
      user-select: none;
      white-space: nowrap;
    }

    .nav-tab:hover {
      color: var(--text-primary);
    }

    .nav-tab.active {
      background: #fff;
      color: var(--text-primary);
      box-shadow: 0 1px 5px rgba(0, 0, 0, 0.13);
    }

    .nav-actions {
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .btn {
      padding: 7px 16px;
      border-radius: 980px;
      font-size: 13px;
      font-weight: 500;
      font-family: inherit;
      cursor: pointer;
      border: none;
      letter-spacing: -0.01em;
      transition: all 0.2s var(--ease);
      display: inline-flex;
      align-items: center;
      gap: 5px;
    }

    .btn-ghost {
      background: rgba(0, 0, 0, 0.06);
      color: var(--text-primary);
    }

    .btn-ghost:hover {
      background: rgba(0, 0, 0, 0.1);
    }

    .btn-primary {
      background: var(--accent);
      color: #fff;
    }

    .btn-primary:hover {
      background: #0077ed;
    }

    .status-tag {
      font-size: 12px;
      font-weight: 500;
      opacity: 0;
      transform: translateY(3px);
      transition: all 0.25s var(--ease);
      display: flex;
      align-items: center;
      gap: 4px;
    }

    .status-tag.show {
      opacity: 1;
      transform: translateY(0);
    }

    .status-tag.ok {
      color: var(--offline);
    }

    .status-tag.info {
      color: var(--text-secondary);
    }

    /* HOME */
    #page-home {
      padding-top: var(--nav-h);
      min-height: 100vh;
    }

    .hero {
      text-align: center;
      padding: 80px 24px 56px;
      max-width: 860px;
      margin: 0 auto;
    }

    .hero-label {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      font-size: 13px;
      font-weight: 500;
      color: var(--accent);
      margin-bottom: 14px;
    }

    .hero-h1 {
      font-size: clamp(38px, 6.5vw, 68px);
      font-weight: 700;
      letter-spacing: -0.035em;
      line-height: 1.07;
      margin-bottom: 18px;
    }

    .hero-sub {
      font-size: 18px;
      color: var(--text-secondary);
      line-height: 1.65;
      font-weight: 300;
      max-width: 520px;
      margin: 0 auto;
    }

    /* ORGCHART SECTION */
    .orgchart-section {
      max-width: 1160px;
      margin: 0 auto 12px;
      padding: 0 24px;
    }

    .orgchart-toggle {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 14px 20px;
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      cursor: pointer;
      user-select: none;
      transition: box-shadow 0.2s var(--ease);
    }

    .orgchart-toggle:hover {
      box-shadow: var(--shadow-sm);
    }

    .orgchart-toggle-left {
      display: flex;
      align-items: center;
      gap: 8px;
      font-size: 14px;
      font-weight: 600;
    }

    .orgchart-toggle-icon {
      font-size: 16px;
    }

    .orgchart-chevron {
      font-size: 11px;
      color: var(--text-tertiary);
      transition: transform 0.25s var(--ease);
    }

    .orgchart-chevron.open {
      transform: rotate(180deg);
    }

    .orgchart-body {
      overflow: hidden;
      max-height: 0;
      transition: max-height 0.4s var(--ease), opacity 0.3s;
      opacity: 0;
    }

    .orgchart-body.open {
      max-height: 1200px;
      opacity: 1;
    }

    .orgchart-img-wrap {
      background: var(--surface);
      border: 1px solid var(--border);
      border-top: none;
      border-radius: 0 0 var(--radius) var(--radius);
      padding: 24px;
      overflow: hidden;
    }

    .orgchart-img-wrap img {
      width: 100%;
      border-radius: 10px;
      display: block;
    }

    .section-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.07em;
      text-transform: uppercase;
      color: var(--text-tertiary);
      padding: 28px 24px 8px;
      max-width: 1160px;
      margin: 0 auto;
    }

    .role-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(250px, 1fr));
      gap: 14px;
      max-width: 1160px;
      margin: 0 auto;
      padding: 0 24px 16px;
    }

    .role-card {
      background: var(--surface);
      border-radius: var(--radius);
      padding: 22px 22px 48px;
      cursor: pointer;
      position: relative;
      overflow: hidden;
      border: 1px solid var(--border);
      transition: transform 0.3s var(--ease), box-shadow 0.3s var(--ease);
    }

    .role-card:hover {
      transform: translateY(-5px);
      box-shadow: var(--shadow-lg);
    }

    .card-stripe {
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 3px;
      opacity: 0;
      transition: opacity 0.3s;
    }

    .role-card:hover .card-stripe {
      opacity: 1;
    }

    .cs-ceo {
      background: linear-gradient(90deg, #888, #555);
    }

    .cs-support {
      background: linear-gradient(90deg, #ff6b00, #ff9500);
    }

    .cs-cross {
      background: linear-gradient(90deg, #5e5ce6, #bf5af2);
    }

    .cs-offline {
      background: linear-gradient(90deg, #34c759, #30d158);
    }

    .cs-online {
      background: linear-gradient(90deg, #007aff, #32ade6);
    }

    .card-tag {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.045em;
      padding: 4px 9px;
      border-radius: 6px;
      margin-bottom: 14px;
      text-transform: uppercase;
    }

    .ct-ceo {
      background: rgba(29, 29, 31, 0.06);
      color: #444;
    }

    .ct-support {
      background: rgba(255, 107, 0, 0.09);
      color: #b84a00;
    }

    .ct-cross {
      background: rgba(94, 92, 230, 0.09);
      color: #3634a3;
    }

    .ct-offline {
      background: rgba(52, 199, 89, 0.09);
      color: #1c7a3a;
    }

    .ct-online {
      background: rgba(0, 122, 255, 0.09);
      color: #0051a8;
    }

    .cdot {
      width: 6px;
      height: 6px;
      border-radius: 50%;
    }

    .d-ceo {
      background: #888;
    }

    .d-support {
      background: var(--support);
    }

    .d-cross {
      background: var(--cross);
    }

    .d-offline {
      background: var(--offline);
    }

    .d-online {
      background: var(--online);
    }

    .card-title {
      font-size: 19px;
      font-weight: 700;
      letter-spacing: -0.02em;
      margin-bottom: 5px;
    }

    .card-person {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 12px;
      min-height: 18px;
    }

    .lv-badge {
      display: inline-block;
      margin-left: 6px;
      padding: 1px 6px;
      border-radius: 5px;
      font-size: 11px;
      font-weight: 600;
      background: rgba(0, 0, 0, 0.05);
      color: var(--text-secondary);
    }

    .card-tags {
      display: flex;
      flex-wrap: wrap;
      gap: 5px;
    }

    .card-tag-pill {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: -0.01em;
      padding: 3px 9px;
      border-radius: 980px;
      display: inline-flex;
      align-items: center;
    }

    /* 사업부별 태그 컬러 */
    .tp-ceo {
      background: rgba(100, 100, 100, 0.09);
      color: #555;
    }

    .tp-support {
      background: rgba(255, 107, 0, 0.10);
      color: #c05000;
    }

    .tp-cross {
      background: rgba(94, 92, 230, 0.10);
      color: #3634a3;
    }

    .tp-offline {
      background: rgba(52, 199, 89, 0.10);
      color: #1a7535;
    }

    .tp-online {
      background: rgba(0, 122, 255, 0.10);
      color: #0050a0;
    }

    .card-go {
      position: absolute;
      bottom: 22px;
      right: 22px;
      width: 30px;
      height: 30px;
      background: var(--bg);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 13px;
      color: var(--text-secondary);
      opacity: 0;
      transform: translateX(-5px);
      transition: all 0.25s var(--ease);
    }

    .role-card:hover .card-go {
      opacity: 1;
      transform: translateX(0);
    }

    /* DETAIL */
    #page-detail {
      display: none;
      padding-top: var(--nav-h);
    }

    @keyframes fadeUp {
      from {
        opacity: 0;
        transform: translateY(18px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    .detail-anim {
      animation: fadeUp 0.4s var(--ease) both;
    }

    .d-hero {
      background: var(--surface);
      border-bottom: 1px solid var(--border);
      padding: 52px 40px 40px;
      cursor: pointer;
    }

    .d-hero:hover .d-hero-back {
      opacity: 1;
    }

    .d-hero-inner {
      max-width: 800px;
      margin: 0 auto;
      position: relative;
    }

    .back-btn {
      position: absolute;
      top: 0;
      right: 0;
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 14px;
      color: var(--accent);
      cursor: pointer;
      background: rgba(0, 113, 227, 0.07);
      border: none;
      font-family: inherit;
      font-weight: 500;
      padding: 7px 14px;
      border-radius: 980px;
      transition: background 0.2s;
    }

    .back-btn:hover {
      background: rgba(0, 113, 227, 0.14);
    }

    .d-badge {
      display: inline-flex;
      align-items: center;
      gap: 5px;
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.05em;
      padding: 5px 11px;
      border-radius: 7px;
      margin-bottom: 16px;
      text-transform: uppercase;
    }

    .d-title {
      font-size: clamp(26px, 4.5vw, 42px);
      font-weight: 700;
      letter-spacing: -0.03em;
      line-height: 1.1;
      margin-bottom: 10px;
    }

    .d-person {
      font-size: 14px;
      color: var(--text-secondary);
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .d-chip {
      background: var(--bg);
      padding: 3px 10px;
      border-radius: 7px;
      font-weight: 500;
      font-size: 13px;
    }

    .d-body {
      max-width: 800px;
      margin: 0 auto;
      padding: 28px 40px 80px;
    }

    /* HERO EDIT FIELDS */
    .hero-edit-block {
      margin-top: 18px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .hero-field-label {
      font-size: 11px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      color: var(--text-tertiary);
      margin-bottom: 5px;
    }

    .hero-input {
      width: 100%;
      padding: 9px 13px;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      font-size: 14px;
      font-family: inherit;
      color: var(--text-primary);
      outline: none;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .hero-input:focus {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.09);
    }

    /* 태그 편집 영역 */
    .tag-edit-wrap {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      align-items: center;
      padding: 8px 10px;
      border-radius: 10px;
      border: 1.5px solid var(--border);
      background: var(--surface);
      min-height: 42px;
      cursor: text;
      transition: border-color 0.2s, box-shadow 0.2s;
    }

    .tag-edit-wrap:focus-within {
      border-color: var(--accent);
      box-shadow: 0 0 0 4px rgba(0, 113, 227, 0.09);
    }

    .tag-pill-edit {
      display: inline-flex;
      align-items: center;
      gap: 4px;
      font-size: 12px;
      font-weight: 600;
      padding: 3px 8px 3px 10px;
      border-radius: 980px;
      user-select: none;
    }

    .tag-pill-edit .tag-del {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: rgba(0, 0, 0, 0.12);
      border: none;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 9px;
      line-height: 1;
      color: inherit;
      font-family: inherit;
      transition: background 0.15s;
      padding: 0;
    }

    .tag-pill-edit .tag-del:hover {
      background: rgba(0, 0, 0, 0.25);
    }

    .tag-input {
      border: none;
      outline: none;
      background: transparent;
      font-size: 13px;
      font-family: inherit;
      color: var(--text-primary);
      min-width: 80px;
      flex: 1;
    }

    .tag-hint {
      font-size: 11px;
      color: var(--text-tertiary);
      margin-top: 4px;
    }

    /* ACCORDION */
    .jd-sec {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: var(--radius);
      margin-bottom: 10px;
      overflow: hidden;
      transition: box-shadow 0.25s;
    }

    .jd-sec:hover {
      box-shadow: var(--shadow-sm);
    }

    .jd-sec-hd {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 18px 22px;
      cursor: pointer;
      user-select: none;
    }

    .jd-sec-hd-l {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .sec-n {
      width: 26px;
      height: 26px;
      background: var(--bg);
      border-radius: 8px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 11px;
      font-weight: 700;
      color: var(--text-secondary);
      flex-shrink: 0;
    }

    .sec-t {
      font-size: 15px;
      font-weight: 600;
      letter-spacing: -0.01em;
    }

    .sec-chev {
      width: 24px;
      height: 24px;
      background: var(--bg);
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 10px;
      color: var(--text-tertiary);
      transition: transform 0.28s var(--ease);
    }

    .jd-sec.closed .sec-chev {
      transform: rotate(-90deg);
    }

    .jd-sec.closed .jd-sec-body {
      display: none;
    }

    .jd-sec-body {
      border-top: 1px solid var(--border);
    }

    /* WYSIWYG TOOLBAR */
    .wy-toolbar {
      display: flex;
      gap: 3px;
      padding: 10px 16px 8px;
      flex-wrap: wrap;
      align-items: center;
      border-bottom: 1px solid var(--border);
      background: #fafafa;
    }

    .wy-sep {
      width: 1px;
      height: 18px;
      background: var(--border);
      margin: 0 3px;
    }

    .tb {
      height: 30px;
      min-width: 30px;
      padding: 0 9px;
      border-radius: 7px;
      font-size: 13px;
      font-weight: 500;
      background: transparent;
      border: 1px solid transparent;
      color: var(--text-secondary);
      cursor: pointer;
      font-family: inherit;
      transition: all 0.15s;
      display: flex;
      align-items: center;
      justify-content: center;
      gap: 4px;
    }

    .tb:hover {
      background: #ebebed;
      border-color: var(--border);
      color: var(--text-primary);
    }

    .tb.active {
      background: #e8e8ed;
      border-color: rgba(0, 0, 0, 0.12);
      color: var(--text-primary);
    }

    /* 특별 버튼 스타일 */
    .tb-bold {
      font-weight: 800;
      font-size: 14px;
    }

    .tb-italic {
      font-style: italic;
      font-size: 14px;
    }

    .tb-underline {
      text-decoration: underline;
    }

    .tb-highlight {
      background: #fff9c4 !important;
      border-color: #f0e040 !important;
      color: #6b5900 !important;
    }

    .tb-highlight:hover {
      background: #fff176 !important;
    }

    /* WYSIWYG EDITOR AREA */
    .wy-editor {
      padding: 16px 18px;
      min-height: 160px;
      font-size: 14px;
      line-height: 1.9;
      color: var(--text-primary);
      outline: none;
      font-weight: 300;
      font-family: 'Noto Sans KR', -apple-system, sans-serif;
    }

    .wy-editor:empty::before {
      content: attr(data-placeholder);
      color: var(--text-tertiary);
      font-style: italic;
      pointer-events: none;
    }

    .wy-editor:focus {
      background: #fefefe;
    }

    /* CONTENT DISPLAY (view mode) */
    .wy-view {
      padding: 16px 18px;
      min-height: 44px;
      font-size: 14px;
      line-height: 1.9;
      color: var(--text-primary);
      font-weight: 300;
    }

    .wy-view.empty {
      color: var(--text-tertiary);
      font-style: italic;
    }

    /* 공통 서식 스타일 (에디터 + 뷰 모드 동일) */
    .wy-editor mark,
    .wy-view mark {
      background: #fff176;
      color: #1d1d1f;
      padding: 1px 3px;
      border-radius: 3px;
    }

    .wy-editor h2,
    .wy-view h2 {
      font-size: 16px;
      font-weight: 700;
      margin: 14px 0 6px;
    }

    .wy-editor h3,
    .wy-view h3 {
      font-size: 14px;
      font-weight: 600;
      margin: 10px 0 4px;
    }

    .wy-editor ul,
    .wy-view ul,
    .wy-editor ol,
    .wy-view ol {
      padding-left: 22px;
      margin: 6px 0;
    }

    .wy-editor li,
    .wy-view li {
      margin: 3px 0;
    }

    .wy-editor blockquote,
    .wy-view blockquote {
      border-left: 3px solid var(--accent);
      margin: 10px 0;
      padding: 8px 14px;
      background: rgba(0, 113, 227, 0.04);
      border-radius: 0 8px 8px 0;
      color: var(--text-secondary);
    }

    .wy-editor hr,
    .wy-view hr {
      border: none;
      border-top: 1px solid var(--border);
      margin: 12px 0;
    }

    /* FONT SIZE BTN */
    .tb-size-wrap {
      display: flex;
      align-items: center;
      gap: 2px;
    }

    footer {
      border-top: 1px solid var(--border);
      padding: 28px 40px;
      text-align: center;
      font-size: 12px;
      color: var(--text-tertiary);
    }

    /* ADMIN MODAL */
    .modal-overlay {
      position: fixed;
      inset: 0;
      z-index: 2000;
      background: rgba(0, 0, 0, 0.35);
      backdrop-filter: blur(6px);
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      pointer-events: none;
      transition: opacity 0.2s;
    }

    .modal-overlay.show {
      opacity: 1;
      pointer-events: all;
    }

    .modal-box {
      background: var(--surface);
      border-radius: 20px;
      padding: 32px 28px 24px;
      width: 320px;
      box-shadow: 0 24px 80px rgba(0, 0, 0, 0.18);
      transform: translateY(10px);
      transition: transform 0.25s var(--ease);
      text-align: center;
    }

    .modal-overlay.show .modal-box {
      transform: translateY(0);
    }

    .modal-title {
      font-size: 17px;
      font-weight: 700;
      margin-bottom: 6px;
    }

    .modal-sub {
      font-size: 13px;
      color: var(--text-secondary);
      margin-bottom: 20px;
    }

    .pin-dots {
      display: flex;
      justify-content: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .pin-dot {
      width: 14px;
      height: 14px;
      border-radius: 50%;
      background: var(--border);
      border: 2px solid var(--border);
      transition: background 0.15s, border-color 0.15s;
    }

    .pin-dot.filled {
      background: var(--accent);
      border-color: var(--accent);
    }

    .pin-dot.error {
      background: #ff3b30;
      border-color: #ff3b30;
    }

    .pin-grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 8px;
    }

    .pin-btn {
      padding: 14px;
      border-radius: 12px;
      border: 1px solid var(--border);
      background: var(--bg);
      font-size: 18px;
      font-weight: 600;
      font-family: inherit;
      cursor: pointer;
      transition: all 0.12s;
    }

    .pin-btn:hover {
      background: var(--surface);
      box-shadow: var(--shadow-sm);
    }

    .pin-btn:active {
      transform: scale(0.94);
    }

    .pin-btn.del {
      font-size: 16px;
      color: var(--text-secondary);
    }

    .modal-cancel {
      margin-top: 12px;
      width: 100%;
      padding: 10px;
      border: none;
      background: none;
      font-size: 14px;
      color: var(--text-secondary);
      font-family: inherit;
      cursor: pointer;
      border-radius: 8px;
    }

    ::-webkit-scrollbar {
      width: 5px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: rgba(0, 0, 0, 0.14);
      border-radius: 10px;
    }
  </style>
</head>

      { t: '핵심 직무 영역', h: `<h2>1. Salon Space 사업 기획/전략</h2><ul><li>오프라인 사업(도림천점) 전반 총괄 관리감독</li><li>신규 오프라인 브랜딩 행사/사업 기획 및 운영관리</li><li>공간사업 성장/확장 전략 수립</li><li>공간대여 사업 관리</li></ul><h2>2. 사업 데이터 관리</h2><ul><li>사업부 예산 관리 (수입/지출)</li><li>공간 운영 데이터 취합·검증</li><li>경영진 보고 자료 작성 (월간·분기·연간)</li><li>각종 인허가·신고 관리</li></ul><h2>3. 사업부 인사관리</h2><ul><li>공간팀장(매니저) 고충 관리</li><li>임금협상 및 근로계약서 작성</li><li>사업부 전체 소속인원 인사평가</li><li>필요에 따라 전체 소속인원 면담</li></ul>` },
      { t: '의무사항 (일간 / 주간 / 월간)', h: `<h2>주간 의무사항</h2><ul><li><strong>주간 사업부 운영 보고서</strong> 공유 → 사무국장<ul><li>매출 / 지출 / 영업이익</li></ul></li></ul><h2>월간 의무사항</h2><ul><li><strong>공간사업부 성과보고서</strong> 공유 (월간 사업 운영 현황 및 결과)</li><li><strong>공간사업부 다음 달 사업기획서</strong> 공유</li></ul>` },
      { t: '책임 및 권한', h: `<h2>책임</h2><ol><li>공간 사업운영 데이터 보존 및 관리</li><li>공간팀 목표 수립 및 관리</li><li>공간 사업 운영 안정화 → <mark>매출 및 영업이익 관리</mark></li><li>공간 브랜딩 사업 성장추진</li></ol><h2>권한</h2><ol><li><strong>사업 운영전략 최종 의사결정권</strong> (공간사업운영권)</li><li><strong>예산운영 결정권</strong></li><li>오프라인 브랜딩 행사/프로젝트 사업 관리감독권</li><li>공간팀 <strong>매니저 인사권</strong></li></ol>` },
      { t: '성과 평가 지표 & 성과 조건', h: `<h2>성과 평가 지표</h2><ol><li><strong>공간사업 영업이익</strong> — 영업이익 안정화 (적정 인건비 비율 유지)</li><li><strong>공간 브랜딩 활동 성과</strong> — 공간경험 만족도</li></ol><hr><h2>성과 조건</h2><p><strong>① 월간 예산 100% 사용 시 → 100% 달성</strong></p><blockquote>⚠️ 월간 예산의 5% 이상 초과부터 성과금 5%씩 삭감</blockquote><p><strong>② 3점 이하 리뷰 없을 시 → 100% 달성</strong></p><blockquote>⚠️ 3점 이하 리뷰 1건당 성과금 1%씩 삭감<br>✅ 전 플랫폼 평균평점 <strong>4.6점 이상</strong> 유지 시 성과금 5% 추가</blockquote><p><strong>③ 오프라인 브랜드 행사 1건 진행 시 → 100% 달성</strong></p><blockquote>⚠️ 행사 미진행 시 성과금 5% 삭감<br>기준: <mark>15명 이상의 브랜드 팬이 참여</mark>하여 콘텐츠를 제작한 행사</blockquote>` },
      { t: '필요역량 & 자격요건', h: '' },
      { t: '역할의 목표', h: `<p>공간을 <strong>"더 열심히"</strong>가 아니라 팀·효율·안정·품질·브랜드 전반적인 완성도로 끌어올려</p><blockquote><mark>Salon Space를 '기업의 핵심 사업 &amp; 캐시 카우 &amp; R&amp;D 허브'로 완성한다.</mark></blockquote><p>현 국내 Salon &amp; F&amp;B 공간 시장에서 <strong>국내 최고 브랜드 공간</strong>으로 완성한다.</p><ul><li>단기 성과가 아니라 <strong>누적되는 브랜드 가치</strong></li><li>개인의 노력보다 <strong>구조와 기준이 작동하는 운영</strong></li><li>한 지점이 아니라 <strong>지점 &amp; 문화 확장 가능한 대표 표준 모델</strong></li></ul>` },
      { t: '역할의 핵심 원칙', h: `<ul><li>핵심 사업이자 핵심 인력을 모두 보유한 팀인만큼 <strong>지혜로운 리더로서의 역량</strong> 매우 중요<ul><li>팀 동료들이 신뢰하고 존경하는 리더</li><li>솔선수범하는 리더</li><li><mark>감정이 태도가 되지 않는, 안정적인 리더</mark></li></ul></li><li>12년의 역사와 데이터를 바탕으로 <strong>명확한 기준과 양질의 데이터</strong>를 기반으로 지혜롭게 운영</li><li>단기 매출보다 <strong>중장기 브랜드 자산</strong> 지향</li><li><strong>행복하게 일하면서 함께 성장하는 지속가능한 비즈니스 구조</strong></li></ul>` },
    ];

    // ─────────────────────────────────────────────────────────────────────────────
    // STATE
    // ─────────────────────────────────────────────────────────────────────────────
    let db = {};
    let cur = null;
    let editMode = false;
    let useCloud = true;
    let lastGroup = 'all'; // 마지막으로 본 그룹 기억

    // ─────────────────────────────────────────────────────────────────────────────
    // API
    // ─────────────────────────────────────────────────────────────────────────────
    async function apiLoad() {
      try {
        const r = await fetch('/api/jd');
        if (!r.ok) throw new Error();
        const j = await r.json();
        return Object.keys(j).length ? j : null;
      } catch { useCloud = false; return null; }
    }
    async function apiSave(data) {
      if (!useCloud) { localStorage.setItem('jd_v5', JSON.stringify(data)); return true; }
      try {
        const r = await fetch('/api/jd', { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify(data) });
        if (!r.ok) throw new Error();
        return true;
      } catch { useCloud = false; localStorage.setItem('jd_v5', JSON.stringify(data)); return false; }
    }


    function setStatus(msg, cls = 'ok', icon = '') {
      const el = document.getElementById('stag');
      document.getElementById('s-icon').textContent = icon;
      document.getElementById('s-msg').textContent = msg;
      el.className = `status-tag ${cls} show`;
      if (cls !== 'info') setTimeout(() => el.classList.remove('show'), 2500);
    }

    // ─────────────────────────────────────────────────────────────────────────────
    // INIT
    // ─────────────────────────────────────────────────────────────────────────────
    async function init() {
      for (const r of ROLES) db[r.id] = { secs: stdSecs(r) };
      let saved = await apiLoad();
      if (!saved) {
        try { saved = JSON.parse(localStorage.getItem('jd_v5') || 'null'); } catch { saved = null; }
      }
      if (saved) restoreSaved(saved);
      renderHome();
    }

    function stdSecs(r) {
      return r.id === '공간사업팀' ? SPACE_SECS.map(s => ({ ...s })) : DEF_SECS(r.core);
    }

    function restoreSaved(saved) {
      // 데이터 호환성 유지: { db, ROLES, v } 형태 또는 이전의 db 자체
      const data = saved.db ? saved.db : saved;
      const sameVersion = saved.v === ROLES_VERSION;

      // 1. 섹션 데이터 복구 — 제목(t) 기준 매칭
      //    이전 버전 데이터는 내용이 있는 섹션만 가져와 새 기본 내용을 덮어쓰지 않도록 함
      for (const r of ROLES) {
        const savedSecs = data[r.id]?.secs;
        if (!savedSecs) continue;
        const secs = stdSecs(r);
        secs.forEach(ss => {
          const m = savedSecs.find(s => s.t === ss.t);
          if (m && (sameVersion || m.h)) ss.h = m.h;
        });
        db[r.id].secs = secs;
      }
      // 조직도에서 빠진 이전 직무 내용은 저장 시 사라지지 않도록 보존
      for (const k of Object.keys(data)) if (!db[k]) db[k] = data[k];

      // 2. 담당자 및 태그 복구 — 같은 버전일 때만
      if (!sameVersion) return;
      (saved.ROLES || []).forEach(sr => {
        const r = ROLES.find(x => x.id === sr.id);
        if (!r) return;
        if (sr.person !== undefined) r.person = sr.person;
        if (sr.tags !== undefined) r.tags = sr.tags;
      });
    }

    // ─────────────────────────────────────────────────────────────────────────────
    // HOME
    // ─────────────────────────────────────────────────────────────────────────────
    function renderHome() {
      for (const g of GROUPS) {
        document.getElementById('g-' + g).innerHTML = ROLES.filter(r => r.group === g).map(r => {
          const tagsHtml = (r.tags || []).map(t =>
            `<span class="card-tag-pill tp-${r.type}">#${t}</span>`
          ).join('');
          return `<div class="role-card" onclick="openRole('${ei(r.id)}')">
        <div class="card-stripe cs-${r.type}"></div>
        <div class="card-tag ct-${r.type}"><span class="cdot d-${r.type}"></span>${r.label}</div>
        <div class="card-title">${r.title}</div>
        <div class="card-person">${r.person || ''}${r.level ? `<span class="lv-badge">${r.level}</span>` : ''}</div>
        <div class="card-tags">${tagsHtml}</div>
        <div class="card-go">→</div>
      </div>`;
        }).join('');
      }
    }

    function filter(type, el) {
      // 디테일 페이지에서 탭 클릭 시 → 홈으로 이동 후 필터 적용
      const onDetail = document.getElementById('page-detail').style.display !== 'none';
      if (onDetail) {
        if (editMode && !confirm('저장하지 않은 변경사항이 있습니다. 이동하시겠습니까?')) return;
        editMode = false; cur = null;
        document.getElementById('page-detail').style.display = 'none';
        document.getElementById('page-home').style.display = 'block';
        showBtns(false); renderHome();
      }
      lastGroup = type;
      document.querySelectorAll('.nav-tab').forEach(t => t.classList.remove('active'));
      el.classList.add('active');
      const show = GROUPS.includes(type) ? [type] : GROUPS;
      GROUPS.forEach(g => {
        const v = show.includes(g);
        document.getElementById('g-' + g).style.display = v ? '' : 'none';
        document.getElementById('lbl-' + g).style.display = v ? '' : 'none';
      });
    }

    // ─────────────────────────────────────────────────────────────────────────────
    // DETAIL
    // ─────────────────────────────────────────────────────────────────────────────
    function openRole(id) {
      cur = id; editMode = false;
      const r = ROLES.find(x => x.id === id);
      lastGroup = r.group === 'ceo' ? 'all' : r.group;
      document.getElementById('page-home').style.display = 'none';
      document.getElementById('page-detail').style.display = 'block';
      document.getElementById('d-hero').classList.remove('detail-anim');
      requestAnimationFrame(() => document.getElementById('d-hero').classList.add('detail-anim'));
      document.getElementById('d-badge').className = `d-badge ct-${r.type}`;
      document.getElementById('d-badge').innerHTML = `<span class="cdot d-${r.type}" style="margin-right:5px"></span>${r.label}`;
      document.getElementById('d-title').textContent = r.title;
      renderHeroView();
      showBtns(false); renderSecs();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    // ─────────────────────────────────────────────────────────────────────────────
    // RENDER SECTIONS
    // ─────────────────────────────────────────────────────────────────────────────
    function renderSecs() {
      const secs = db[cur]?.secs || [];
      document.getElementById('sec-wrap').innerHTML = secs.map((s, i) => `
    <div class="jd-sec" id="jds${i}">
      <div class="jd-sec-hd" onclick="toggleS(${i})">
        <div class="jd-sec-hd-l">
          <div class="sec-n">${i + 1}</div>
          <div class="sec-t">${s.t}</div>
        </div>
        <div class="sec-chev">▼</div>
      </div>
      <div class="jd-sec-body">
        ${editMode ? `
          <div class="wy-toolbar" id="tb${i}">
            <button class="tb tb-bold"      onmousedown="fmt(event,'bold')"         title="굵게 (Ctrl+B)">B</button>
            <button class="tb tb-italic"    onmousedown="fmt(event,'italic')"       title="기울임 (Ctrl+I)">I</button>
            <button class="tb tb-underline" onmousedown="fmt(event,'underline')"    title="밑줄 (Ctrl+U)">U</button>
            <div class="wy-sep"></div>
            <button class="tb tb-highlight" onmousedown="fmtHighlight(event,${i})"  title="하이라이트">🖊 하이라이트</button>
            <div class="wy-sep"></div>
            <button class="tb"              onmousedown="fmtBlock(event,'h2')"      title="소제목">H2</button>
            <button class="tb"              onmousedown="fmtBlock(event,'h3')"      title="작은제목">H3</button>
            <div class="wy-sep"></div>
            <button class="tb"              onmousedown="fmt(event,'insertUnorderedList')" title="목록">• 목록</button>
            <button class="tb"              onmousedown="fmt(event,'insertOrderedList')"   title="번호목록">1. 목록</button>
            <div class="wy-sep"></div>
            <button class="tb"              onmousedown="fmtQuote(event,${i})"      title="인용문">❝ 인용</button>
            <button class="tb"              onmousedown="fmtHr(event,${i})"         title="구분선">— 구분선</button>
            <div class="wy-sep"></div>
            <button class="tb"              onmousedown="fmt(event,'removeFormat')" title="서식 지우기" style="color:#ff3b30">✕ 서식 제거</button>
          </div>
          <div
            class="wy-editor"
            id="ed${i}"
            contenteditable="true"
            data-placeholder="내용을 입력하세요..."
            onkeydown="handleKey(event,${i})"
          >${s.h || ''}</div>
        ` : `
          <div class="wy-view ${s.h ? '' : 'empty'}">
            ${s.h || '내용을 입력해주세요.'}
          </div>
        `}
      </div>
    </div>`).join('');
    }

    function toggleS(i) { document.getElementById('jds' + i).classList.toggle('closed'); }

    // ─────────────────────────────────────────────────────────────────────────────
    // WYSIWYG 포맷 커맨드
    // ─────────────────────────────────────────────────────────────────────────────
    function fmt(e, cmd, val) {
      e.preventDefault(); // 포커스 잃지 않도록
      document.execCommand(cmd, false, val || null);
    }

    function fmtBlock(e, tag) {
      e.preventDefault();
      document.execCommand('formatBlock', false, tag);
    }

    function fmtHighlight(e, i) {
      e.preventDefault();
      const sel = window.getSelection();
      if (!sel.rangeCount || sel.isCollapsed) return;
      const range = sel.getRangeAt(0);
      // 이미 mark로 감싸져 있으면 해제
      const parent = sel.anchorNode?.parentElement;
      if (parent && parent.tagName === 'MARK') {
        const text = document.createTextNode(parent.textContent);
        parent.replaceWith(text);
        return;
      }
      const mark = document.createElement('mark');
      try { range.surroundContents(mark); } catch {
        // 여러 블록에 걸쳐있는 경우 처리
        const frag = range.extractContents();
        mark.appendChild(frag);
        range.insertNode(mark);
      }
    }

    function fmtQuote(e, i) {
      e.preventDefault();
      document.execCommand('formatBlock', false, 'blockquote');
    }

    function fmtHr(e, i) {
      e.preventDefault();
      document.execCommand('insertHorizontalRule', false, null);
    }

    function handleKey(e, i) {
      // Ctrl/Cmd + B, I, U는 브라우저가 자동 처리
      // Enter after H2/H3 → 일반 단락으로 돌아오기
      if (e.key === 'Enter') {
        const sel = window.getSelection();
        const block = sel.anchorNode?.closest?.('h2, h3');
        if (block) {
          e.preventDefault();
          document.execCommand('formatBlock', false, 'p');
        }
      }
    }

    // ─────────────────────────────────────────────────────────────────────────────
    // EDIT / SAVE / CANCEL
    // ─────────────────────────────────────────────────────────────────────────────
    function showBtns(ed) {
      document.getElementById('btn-edit').style.display = cur && !ed ? 'inline-flex' : 'none';
      document.getElementById('btn-save').style.display = ed ? 'inline-flex' : 'none';
      document.getElementById('btn-cancel').style.display = ed ? 'inline-flex' : 'none';
    }

    // 헤더 영역 — 보기 모드
    function renderHeroView() {
      const r = ROLES.find(x => x.id === cur);
      const personHtml = r.person ? `<span class="d-chip">👤 ${r.person}${r.level ? ` · ${r.level}` : ''}</span>` : '';
      const tagsHtml = (r.tags || []).map(t =>
        `<span class="card-tag-pill tp-${r.type}">#${t}</span>`
      ).join('');
      document.getElementById('d-person').innerHTML = personHtml + tagsHtml;
    }

    // 헤더 영역 — 편집 모드 (담당자 + 태그)
    function renderHeroEdit() {
      const r = ROLES.find(x => x.id === cur);
      const tagPills = (r.tags || []).map((t, i) =>
        `<span class="tag-pill-edit tp-${r.type}">
       #${t}
       <button class="tag-del" onclick="removeTag(${i})" title="삭제">✕</button>
     </span>`
      ).join('');
      document.getElementById('d-person').innerHTML = `
    <div class="hero-edit-block">
      <div>
        <div class="hero-field-label">담당자</div>
        <input id="hero-person" class="hero-input" type="text"
          placeholder="이름을 입력하세요" value="${esc(r.person || '')}">
      </div>
      <div>
        <div class="hero-field-label">업무 태그</div>
        <div class="tag-edit-wrap" onclick="document.getElementById('tag-new-input').focus()">
          <span id="tag-pills-wrap">${tagPills}</span>
          <input id="tag-new-input" class="tag-input" type="text"
            placeholder="태그 입력 후 Enter"
            onkeydown="handleTagInput(event)">
        </div>
        <div class="tag-hint">Enter로 추가, 각 태그의 ✕로 삭제</div>
      </div>
    </div>`;
    }

    function removeTag(idx) {
      const r = ROLES.find(x => x.id === cur);
      r.tags.splice(idx, 1);
      renderHeroEdit();
    }

    function handleTagInput(e) {
      if (e.key !== 'Enter' && e.key !== ',') return;
      e.preventDefault();
      const val = e.target.value.replace(/^#/, '').replace(/,/g, '').trim();
      if (!val) return;
      const r = ROLES.find(x => x.id === cur);
      r.tags = r.tags || [];
      r.tags.push(val);
      e.target.value = '';
      renderHeroEdit();
      // 포커스 유지
      setTimeout(() => document.getElementById('tag-new-input')?.focus(), 0);
    }

    function enterEdit() {
      editMode = true; showBtns(true);
      renderHeroEdit(); renderSecs();
    }

    function cancelEdit() {
      editMode = false; showBtns(false);
      renderHeroView(); renderSecs();
    }

    async function saveAll() {
      const r = ROLES.find(x => x.id === cur);
      // 담당자 이름 저장
      const personInput = document.getElementById('hero-person');
      if (personInput) r.person = personInput.value.trim();
      // 섹션 내용 수집
      db[cur].secs.forEach((s, i) => {
        const ed = document.getElementById('ed' + i);
        if (ed) s.h = ed.innerHTML;
      });
      setStatus('저장 중...', 'info', '⏳');
      const ok = await apiSave({ db, ROLES, v: ROLES_VERSION });
      editMode = false; showBtns(false);
      renderHeroView(); renderSecs();
      renderHome(); // 카드 태그/담당자 업데이트
      setStatus(ok && useCloud ? '클라우드에 저장됨' : '로컬에 저장됨', 'ok', ok && useCloud ? '☁️' : '💾');
    }

    // 헤더 영역 클릭 시 편집 UI 안 건드리면 뒤로
    function handleHeroClick(e) {
      if (editMode) return; // 편집 중엔 무시
      if (e.target.closest('button, input, .tag-edit-wrap, .tag-pill-edit')) return;
      showHome();
    }

    function showHome() {
      if (editMode && !confirm('저장하지 않은 변경사항이 있습니다. 이동하시겠습니까?')) return;
      editMode = false; cur = null;
      document.getElementById('page-detail').style.display = 'none';
      document.getElementById('page-home').style.display = 'block';
      showBtns(false); renderHome();
      // 마지막 카테고리로 필터 복원
      const tab = [...document.querySelectorAll('.nav-tab')].find(t =>
        t.getAttribute('onclick')?.includes(`'${lastGroup}'`)
      );
      if (tab) filter(lastGroup, tab);
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function esc(s) { return s ? s.replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;') : ''; }
    function ei(s) { return s.replace(/'/g, "\\'"); }

    // ─────────────────────────────────────────────────────────────────────────────
    // ADMIN PASSWORD
    // ─────────────────────────────────────────────────────────────────────────────
    const ADMIN_PIN = '6009';
    let pinBuf = '';

    function checkAdmin() {
      pinBuf = '';
      updatePinDots();
      document.getElementById('admin-modal').classList.add('show');
    }

    function closeModal() {
      document.getElementById('admin-modal').classList.remove('show');
      pinBuf = '';
      updatePinDots();
    }

    function modalBgClick(e) {
      if (e.target === document.getElementById('admin-modal')) closeModal();
    }

    function updatePinDots(shake = false) {
      for (let i = 0; i < 4; i++) {
        const d = document.getElementById('pd' + i);
        d.className = 'pin-dot' + (i < pinBuf.length ? ' filled' : '') + (shake ? ' error' : '');
      }
    }

    function pinInput(n) {
      if (pinBuf.length >= 4) return;
      pinBuf += n;
      updatePinDots();
      if (pinBuf.length === 4) {
        if (pinBuf === ADMIN_PIN) {
          setTimeout(() => {
            closeModal();
            enterEdit();
          }, 150);
        } else {
          // 틀림 — 빨간 점 + 초기화
          updatePinDots(true);
          setTimeout(() => { pinBuf = ''; updatePinDots(); }, 700);
        }
      }
    }

    function pinDel() {
      pinBuf = pinBuf.slice(0, -1);
      updatePinDots();
    }


    function toggleOrgchart() {
      const body = document.getElementById('orgchart-body');
      const chevron = document.getElementById('org-chevron');
      const isOpen = body.classList.toggle('open');
      chevron.classList.toggle('open', isOpen);
    }

    init();
  </script>
</body>

</html>
